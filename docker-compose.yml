services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      PORT: "5000"
      NODE_ENV: development
      CLIENT_URL: http://localhost:8080

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped
