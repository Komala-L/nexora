server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent browser caching of HTML
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
